name: Trend Radar

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours — adjust as you like
  workflow_dispatch: {}      # lets you trigger manually from the Actions tab

jobs:
  collect-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persist the SQLite DB across runs so we don't re-notify the same items.
      # Dynamic key with restore fallback ensures modified DB state is saved on every run.
      - name: Restore DB cache
        uses: actions/cache/restore@v4
        with:
          path: trend_radar.db
          key: trend-radar-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trend-radar-db-

      - name: Run collector
        run: python collector.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Send Telegram digest
        run: python notify_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save DB cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: trend_radar.db
          key: trend-radar-db-${{ github.run_id }}-${{ github.run_attempt }}

