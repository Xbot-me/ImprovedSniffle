name: Trend Radar

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

# Prevent concurrent runs from restoring the same SQLite snapshot and then
# saving divergent histories.
concurrency:
  group: trend-radar-history
  cancel-in-progress: false

jobs:
  collect-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cache is best-effort persistence, not a database. Eviction or a cache
      # miss can still reset history and cause old items to be notified again.
      - name: Restore DB cache
        uses: actions/cache/restore@v4
        with:
          path: trend_radar.db
          key: trend-radar-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trend-radar-db-

      - name: Run collector
        run: python collector.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Send Telegram digest
        run: python notify_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save DB cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: trend_radar.db
          key: trend-radar-db-${{ github.run_id }}-${{ github.run_attempt }}
